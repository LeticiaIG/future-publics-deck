<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Future Publics Deck: a digital hackpack based on Stuart Candy's The Thing from the Future, for deliberating urban futures. Deal six cards, lock, vary, invent, draw.">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Future Publics Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<style>
/* Layout: a tabletop instrument. One device chassis per section; six knob modules make the hand; a black LCD reads the sentence;
   round tactile keys drive the actions; the gallery is a rack of saved "patches". Warm grey plastic, black print, one orange signal. */
:root{
  --body:#cfceC7;        /* chassis plastic */
  --panel:#e7e6e0;       /* module face */
  --key:#f5f4ef;         /* white keys */
  --key-shadow:#b7b6af;
  --ink:#151515;
  --muted:#6a6965;
  --line:#aeada6;
  --accent:#ff4d00;      /* signal orange */
  --accent-ink:#1a0800;
  --screen:#161616;
  --screen-fg:#f2f0e8;
  --screen-dim:#8a8880;
  --led-off:#9d9c95;
  --danger:#c8271a;
  --f-display:"TE Grotesk", "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono:"TE Grotesk", "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-code:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
/* Univers if the viewer has it installed (the family the brand sets its site in), else Helvetica Neue, else the open Hanken Grotesk */
@font-face{font-family:"TE Grotesk";font-weight:300;src:local("Univers 45 Light"),local("Univers-Light"),local("UniversLTStd-Light"),local("Univers LT Std 45 Light"),local("Helvetica Neue Light"),local("HelveticaNeue-Light")}
@font-face{font-family:"TE Grotesk";font-weight:400;src:local("Univers 55 Roman"),local("Univers-Roman"),local("UniversLTStd"),local("Univers LT Std 55 Roman"),local("Univers"),local("Helvetica Neue"),local("HelveticaNeue")}
@font-face{font-family:"TE Grotesk";font-weight:500;src:local("Univers 65 Bold"),local("Univers-Bold"),local("UniversLTStd-Bold"),local("Helvetica Neue Medium"),local("HelveticaNeue-Medium")}
@font-face{font-family:"TE Grotesk";font-weight:300;font-style:italic;src:local("Univers 45 Light Oblique"),local("Univers-LightOblique"),local("Helvetica Neue Light Italic"),local("HelveticaNeue-LightItalic")}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --body:#1a1a19;--panel:#262625;--key:#343433;--key-shadow:#0d0d0c;--ink:#ecebe5;--muted:#9c9b95;--line:#45443f;
  --accent:#ff5a14;--accent-ink:#1a0800;--screen:#0a0a0a;--screen-fg:#f4f2ea;--screen-dim:#7a7872;--led-off:#4a4945;--danger:#ff6a5b;color-scheme:dark}}
:root[data-theme="dark"]{
  --body:#1a1a19;--panel:#262625;--key:#343433;--key-shadow:#0d0d0c;--ink:#ecebe5;--muted:#9c9b95;--line:#45443f;
  --accent:#ff5a14;--accent-ink:#1a0800;--screen:#0a0a0a;--screen-fg:#f4f2ea;--screen-dim:#7a7872;--led-off:#4a4945;--danger:#ff6a5b;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--body);color:var(--ink);font-family:var(--f-mono);font-weight:300;font-size:15px;line-height:1.45;text-transform:lowercase;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 72px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:300;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:300;letter-spacing:-.02em}
h2{font-size:1rem;font-weight:400;letter-spacing:.02em}
h3{font-size:1.6rem;font-weight:300;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;color:var(--muted);font-weight:400}
.lede{max-width:62ch;color:var(--muted);font-size:.9rem}
.credit{max-width:62ch;font-size:.95rem;color:var(--ink);border-left:3px solid var(--accent);padding-left:12px}
.credit em{font-style:italic;text-transform:none}
.note{font-size:.76rem;color:var(--muted)}
.note.err{color:var(--danger)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
pre,textarea,input,select,option{text-transform:none}

/* chassis */
.device{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 1px 0 var(--key), inset 0 1px 0 rgba(255,255,255,.35)}
.device::before,.device::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--line);
  box-shadow:inset 0 0 0 2px var(--panel), inset 0 0 0 3px var(--muted);top:9px}
.device::before{left:9px}.device::after{right:9px}
.rail{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ribs{height:14px;flex:1 1 60px;max-width:180px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 6px);opacity:.8}
.print{font-size:.72rem;letter-spacing:.04em;color:var(--muted)}

/* keys */
.key{display:inline-flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.key > span:first-child{width:54px;height:54px;border-radius:50%;background:var(--key);border:1px solid var(--line);
  box-shadow:0 4px 0 var(--key-shadow), inset 0 1px 0 rgba(255,255,255,.6);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:400;font-size:.95rem;letter-spacing:0;transition:transform .06s, box-shadow .06s}
.key.orange > span:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 0 #a33000, inset 0 1px 0 rgba(255,255,255,.35)}
.key:hover > span:first-child{transform:translateY(1px);box-shadow:0 3px 0 var(--key-shadow)}
.key:active > span:first-child{transform:translateY(4px);box-shadow:0 0 0 var(--key-shadow)}
.key.orange:active > span:first-child{box-shadow:0 0 0 #a33000}
.key > span:last-child{font-size:.7rem;letter-spacing:.03em;color:var(--muted)}
.key:disabled{opacity:.45;cursor:not-allowed}
.btn{font-family:var(--f-mono);font-size:.78rem;font-weight:400;letter-spacing:.02em;background:var(--key);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:.45rem .8rem;box-shadow:0 2px 0 var(--key-shadow);transition:transform .06s, box-shadow .06s;white-space:nowrap}
.btn:hover{transform:translateY(1px);box-shadow:0 1px 0 var(--key-shadow)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.orange{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 0 #a33000}
.btn.ghost{box-shadow:none;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.tab{font-family:var(--f-mono);font-size:.74rem;font-weight:400;letter-spacing:.02em;border:1px solid var(--line);background:var(--key);color:var(--ink);padding:3px 10px;border-radius:999px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
select,input[type=search],textarea,.card .add input,.manual input{font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:6px;background:var(--key);color:var(--ink);padding:.4rem .55rem;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
input::placeholder{color:var(--muted)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* screen */
.screen{background:var(--screen);color:var(--screen-fg);border-radius:8px;padding:16px 18px;font-family:var(--f-mono);font-weight:300;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.4;
  box-shadow:inset 0 0 0 1px #000, inset 0 2px 8px rgba(0,0,0,.6);position:relative;min-height:84px}
.screen::before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.07);border-radius:4px;pointer-events:none}
.screen mark{background:none;color:var(--accent)}
.screen .dim{color:var(--screen-dim);font-size:.72rem;letter-spacing:.05em;display:block;margin-bottom:6px}

/* header */
header{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
.howto{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel)}
.howto ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:.9rem;line-height:1.4}
.howto ol li::marker{color:var(--accent);font-variant-numeric:tabular-nums}
.howto b{font-weight:500}
.howto .plate{max-width:none;margin-top:4px}
@media (max-width:720px){header{grid-template-columns:1fr}}
.plate{font-size:.78rem;letter-spacing:.01em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-width:420px;line-height:1.6}
.plate b{color:var(--ink);font-weight:500}
.jump{gap:4px 16px;font-size:.78rem;letter-spacing:.02em}
.jump a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:1px}

/* modules (the hand) */
.deck{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.deck{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.deck{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.deck{grid-template-columns:1fr}}
.card{background:var(--key);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:260px;position:relative}
.card.locked{box-shadow:inset 0 0 0 2px var(--accent)}
.card .suit{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .suit .eyebrow{font-size:.72rem;color:var(--ink);display:flex;flex-direction:column;gap:1px;min-width:0}
.card .suit .eyebrow .es{font-size:.66rem;color:var(--muted)}
.card .num{font-family:var(--f-display);font-weight:400;font-size:.72rem;color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}
.sw{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0}
.sw .led{width:8px;height:8px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 0 1px rgba(0,0,0,.4)}
.sw[aria-pressed="true"] .led{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.sw .track{width:26px;height:14px;border-radius:7px;background:var(--line);position:relative;transition:background .12s}
.sw .track::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--key);box-shadow:0 1px 1px rgba(0,0,0,.3);transition:left .12s}
.sw[aria-pressed="true"] .track{background:var(--ink)}
.sw[aria-pressed="true"] .track::after{left:14px}
.card .val{font-family:var(--f-display);font-weight:300;font-size:1.35rem;line-height:1.1;letter-spacing:-.01em;flex:1;overflow-wrap:break-word}
.card .val small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.68rem;letter-spacing:.08em;color:var(--muted);margin-top:5px;text-transform:none}
.knobrow{display:flex;align-items:center;gap:10px}
.knob{width:46px;height:46px;border-radius:50%;flex:none;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%, var(--panel), var(--key-shadow));
  box-shadow:0 3px 0 var(--key-shadow), inset 0 1px 0 rgba(255,255,255,.5);position:relative;padding:0;transition:transform .15s}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:3px;height:14px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.knob:active{transform:scale(.96)}
.ticks{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ticks .scale{height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 7px)}
.ticks .pos{font-size:.68rem;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.card select{width:100%;font-size:.78rem;padding:.3rem .4rem}
.card .add{display:flex;gap:4px}
.card .add input{flex:1;min-width:0;font-size:.74rem;border-style:dashed;padding:.25rem .45rem;box-shadow:none}
.card .add .btn{padding:.15rem .5rem;font-size:.85rem;line-height:1}

/* variations */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--key);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile .slot{font-family:var(--f-display);font-weight:400;font-size:.72rem;letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .s{font-size:.84rem;line-height:1.5}
.tile .s b{font-weight:500;color:var(--accent)}
.tile .out{font-size:.84rem;color:var(--muted);min-height:1.2em}
.tile .out strong{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.7rem;letter-spacing:.01em;border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap;color:var(--muted)}
.chip.k{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.manual{display:flex;gap:6px}
.manual input{flex:1;min-width:0;font-size:.8rem}

/* gallery: a grid of simple cards (image · title · text · the six cards); details fold the rest */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.inv{background:var(--key);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.inv .pic{background:#fff;border-bottom:1px solid var(--line)}
.dropwrap{display:flex;flex-direction:column;gap:8px;padding:12px 16px 0}
.dropzone{border:2px dashed var(--line);border-radius:10px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:14px;cursor:pointer;background:var(--panel);color:var(--muted);transition:border-color .12s,background .12s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--ink)}
.dropzone .dz-ico{font-size:1.6rem;line-height:1;color:var(--accent)}
.dropzone .dz-t{font-size:.92rem;color:var(--ink)}
.inv .pic img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#fff}
.inv .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.inv h3{font-size:1.5rem}
.pitch{font-size:.92rem;line-height:1.45}
.tags{gap:6px 10px;min-height:1.2em}
.example-tag{font-size:.7rem;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px}
.example-tag.mine{background:var(--ink);color:var(--panel)}
.chip.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions{gap:6px}
.btn.like{font-variant-numeric:tabular-nums}
.btn.like.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 0 #a33000}
.welcome{border-color:var(--accent)}
.welcome input{font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:6px;background:var(--key);color:var(--ink);padding:.5rem .6rem}
details.more{border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:.78rem;color:var(--muted)}
details.more summary:hover{color:var(--ink)}
.moreb{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.origin-s{font-size:.84rem;color:var(--muted);max-width:72ch}
.origin-s b{color:var(--ink);font-weight:500}
ol.steps{margin:0;padding-left:1.3em;font-size:.86rem;line-height:1.45;display:flex;flex-direction:column;gap:4px}
ol.steps li::marker{color:var(--accent);font-variant-numeric:tabular-nums}
.question{font-family:var(--f-display);font-weight:300;font-size:1.2rem;line-height:1.25;letter-spacing:-.01em}
dl.brief{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.84rem}
dl.brief dt{font-size:.72rem;letter-spacing:.03em;color:var(--muted);padding-top:3px}
dl.brief dd{margin:0}
.pubform{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pubform input{font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:6px;background:var(--key);color:var(--ink);padding:.35rem .5rem;flex:1 1 150px;min-width:0}
.prompt{display:flex;flex-direction:column;gap:10px}
.prompt pre{margin:0;font-family:var(--f-code);font-size:.72rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--screen);color:var(--screen-fg);border-radius:8px;padding:12px 14px;max-height:200px;overflow:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=search]{min-width:0;flex:1 1 200px;max-width:320px}
details.edit summary{cursor:pointer;font-size:.85rem;letter-spacing:.02em}
.editgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:1000px){.editgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.editgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.editgrid label{display:flex;flex-direction:column;gap:6px;font-size:.72rem;letter-spacing:.03em;color:var(--muted);min-width:0}
.editgrid textarea{min-height:200px;font-size:.8rem;letter-spacing:0;font-family:var(--f-code);resize:vertical;width:100%;color:var(--ink)}
.keys{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
details.import{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
details.import summary{cursor:pointer;font-size:.85rem}
details.import textarea{width:100%;min-height:120px;font-family:var(--f-code);font-size:.76rem;resize:vertical;margin-top:10px;color:var(--ink)}
details.import .row{margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="row" style="justify-content:space-between">
        <span class="eyebrow">future publics · boston · thing-from-the-future hackpack · rev 6</span>
        <div class="row" id="langSw" role="group" aria-label="language"><button class="tab" data-lang="es" aria-pressed="true">es</button><button class="tab" data-lang="en" aria-pressed="false">en</button></div>
      </div>
      <h1>Future Publics Deck</h1>
      <p class="credit" data-i18n-html="credit"></p>
      <p class="lede" data-i18n="lede"></p>
      <nav class="row jump" aria-label="sections">
        <a href="#h-hand" data-i18n="nav_table"></a><a href="#h-var" data-i18n="nav_var"></a><a href="#h-gal" data-i18n="nav_gal"></a><a href="#editor" data-i18n="nav_decks"></a>
      </nav>
      <p class="note" id="who"></p>
    </div>
    <div class="howto">
      <span class="eyebrow" data-i18n="howto"></span>
      <ol>
        <li data-i18n-html="how1"></li>
        <li data-i18n-html="how2"></li>
        <li data-i18n-html="how3"></li>
        <li data-i18n-html="how4"></li>
      </ol>
      <p class="plate" data-i18n-html="formula"></p>
    </div>
  </header>

  <section class="device welcome" id="welcome" hidden aria-labelledby="h-welcome">
    <div class="rail">
      <h2 id="h-welcome" data-i18n="w_title"></h2>
      <div class="ribs" aria-hidden="true"></div>
    </div>
    <p class="note" style="max-width:62ch" data-i18n="w_text"></p>
    <form class="row" id="welcomeForm">
      <input id="wName" data-i18n-ph="name_ph" data-i18n-label="name_aria" autocomplete="nickname" style="flex:1 1 220px;min-width:0">
      <input id="wPlace" data-i18n-ph="w_place_ph" data-i18n-label="place_aria" autocomplete="off" style="flex:1 1 220px;min-width:0">
      <button class="btn orange" type="submit" data-i18n="w_start"></button>
      <span class="note" id="wNote"></span>
    </form>
  </section>

  <section class="device" aria-labelledby="h-hand">
    <div class="rail">
      <h2 id="h-hand" data-i18n="h_table"></h2>
      <div class="ribs" aria-hidden="true"></div>
      <span class="print" data-i18n="print_table"></span>
    </div>
    <div class="screen" id="screen"><span class="dim" data-i18n="now_playing"></span><span id="sentence"></span></div>
    <div class="deck" id="deck"></div>

async function toggleLike(v, btn, note){
  const id = v.id.replace(/^sh-/,""); const row = shared.find(r => r.id === id); btn.disabled = true;
  try{
    if (likes[id]){
      await sbFetch("likes?invention_id=eq." + encodeURIComponent(id), {method:"DELETE", headers:{"x-owner-token": ownerToken, "prefer":"return=minimal"}});
      delete likes[id]; if (row) row.likes = [{count: Math.max(0, likeCount(row) - 1)}];
    } else {
      await sbFetch("likes", {method:"POST", headers:{"prefer":"return=minimal"}, body: JSON.stringify({invention_id:id, voter: ownerToken})});
      likes[id] = true; if (row) row.likes = [{count: likeCount(row) + 1}];
    }
    store.set("fp.likes", likes); renderGallery();
  }catch(e){ note.textContent = t("like_err"); btn.disabled = false; }
}
const likeCount = r => (Array.isArray(r.likes) && r.likes[0] && Number(r.likes[0].count)) || 0;
const sharedOK = () => !!(SHARED.url && SHARED.anonKey);
async function sbFetch(path, opts={}){
  const r = await fetch(SHARED.url.replace(/\/$/,"") + "/rest/v1/" + path, {...opts,
    headers:{"apikey":SHARED.anonKey, "authorization":"Bearer "+SHARED.anonKey, "content-type":"application/json", "prefer":"return=representation", ...(opts.headers||{})}});
  if (!r.ok) throw new Error((await r.text()).slice(0,200));
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
async function deleteShared(id){
  const res = await sbFetch("inventions?id=eq." + encodeURIComponent(id), {method:"DELETE", headers:{"x-owner-token": ownerToken}});
  if (!Array.isArray(res) || !res.length) throw new Error(t("del_denied"));
  shared = shared.filter(r => r.id !== id);
  for (const v of inventions) if (v.sharedId === id){ delete v.sharedId; }
  save();
}
async function loadShared(){
  try{ shared = await sbFetch("inventions?select=" + SHARED_COLS + "&order=created_at.desc&limit=400"); sharedLoaded = true; sharedError = ""; }
  catch(e){ sharedError = t("shared_err") + e.message; }
}
async function detectPlace(){
  const c = store.get("fp.place", null); if (c) return c;
  for (const [url, pick] of [["https://ipapi.co/json/", j=>[j.city, j.country_name]], ["https://ipwho.is/", j=>[j.city, j.country]]]){
    try{ const j = await (await fetch(url)).json(); const p = pick(j).filter(Boolean).join(", "); if (p){ store.set("fp.place", p); return p; } }catch(e){}
  }
  return "";
}
async function publishInvention(v, authorName, place){
  const row = { author_id: authorId, owner_token: ownerToken, author_name: authorName || null, place: place || null, lang: uiLang,
    hand: v.hand, name: v.name, pitch: v.pitch || "", steps: v.steps || [], question: v.question || "", visual: v.visual || "", blender: v.blender || null, rejected: v.rejected || [], image_url: v.imageUrl || null, tr: v.tr || {} };
  row.lang = v.lang || uiLang;
  const res = await sbFetch("inventions", {method:"POST", body: JSON.stringify(row)});
  const saved = Array.isArray(res) ? res[0] : res;
  v.sharedId = saved && saved.id || true; v.place = place || ""; v.author = authorName || ""; save();
  if (saved) shared.unshift(saved);
}

};

function buildPrompt(hands){
  const lang = uiLang === "es" ? "Spanish" : "English", other = uiLang === "es" ? "English" : "Spanish";
  const notech = $("#notech").checked;
  const techRule = notech
    ? `FORBIDDEN: the object may not gain any technological feature. No sensors, screens, apps, AI, drones, robots, nothing that "follows you", "learns", "glows", "detects" or "moves by itself". The change must be social, legal, material, temporal, economic, ecological or relational.`
    : `Technology is allowed only if the Move card calls for it, and never as the point of the idea. Prefer social, legal, material, temporal, economic, ecological or relational changes. Never "it follows you", "it learns", "it glows".`;
  return `You are helping an urban anthropologist at the MIT Media Lab run an experiential-futures game (an adaptation of Stuart Candy's "The Thing from the Future") for public deliberation on Boston's future. Each combination has six cards: Arc (type of future + time horizon), Terrain (domain), Object (the form the thing takes: a piece of the street, or an artifact like a sign, a fine, a rule, a song), Move (the KIND of change it undergoes), Mood (the feeling it must evoke) and Public (who lives this future).

For EACH combination invent one "thing from the future" set in a real Boston street context. Method, in this order:
1. Start from the END. Imagine the strangest credible version of this object in that future as the Public encounters it. Write the step-6 caption first.
2. Reverse archaeology: steps 5, 4, 3, 2, 1 explain how we got there, each a small plausible change, with step 1 being the ordinary object everyone trusts today.
3. The Move card dictates what kind of change happens. ${techRule}
4. The Public is the protagonist: their need, fear or habit drives the invention. The Mood is a constraint, not decoration.
5. Before answering, write three obvious ideas and reject them. The answer must not be any of them. Avoid "a thing that moves with you" unless the Move card says so.
Be concrete, sensory and surprising. The idea must work as an animated scene in Blender.

Write in ${lang}. Reply with only a JSON array, one object per combination in the same order:
[{"i":0,"name":"2-4 words","rejected":["three obvious ideas you discarded, 6 words each"],"pitch":"one or two sentences","steps":["six short captions, max 14 words each, in order 1 to 6"],"question":"one open question this future raises for public deliberation","visual":"one sentence describing the single most telling image of this future: who is in it, what the object is doing, where","blender":{"scene":"setting","motion":"what moves and how","light":"lighting","sound":"soundscape"},"tr":{"name":"…","pitch":"…","steps":["…"],"question":"…"}}]
"tr" holds the same name, pitch, steps and question translated into ${other} (the visual and blender fields stay in English).

Card values may be written in Spanish or English; keep their meaning.

Combinations:
${hands.map((h,i)=>`${i}. Arc: ${h.arc} | Terrain: ${h.terrain} | Object: ${h.object} | Move: ${h.move} | Mood: ${h.mood} | Public: ${h.public}`).join("\n")}`;
}

  try{

      r = await fetch("https://api.openai.com/v1/chat/completions", {method:"POST", signal,

    } else {

        headers:{"content-type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},

function parseLoose(t){
  const s = String(t).replace(/```[a-z]*\n?/gi, "");
  const a = s.indexOf("["), b = s.lastIndexOf("]"), o = s.indexOf("{"), c = s.lastIndexOf("}");
  const objFirst = o >= 0 && (a < 0 || o < a);
  const cut = objFirst && c > o ? s.slice(o, c+1) : ((a >= 0 && b > a) ? s.slice(a, b+1) : s);
  return JSON.parse(cut);
}
async function askJSON(prompt, signal){

  if (api && api.key){ const t = await apiAsk(prompt, signal); try{ return parseLoose(t); }catch(e){ throw {code:"invalid_json", text:t}; } }
  throw {code:"not_granted"};
}
function errCopy(e){
  const code = e && e.code || "";

    const st = Number(code.slice(4));
    if (st === 401 || st === 403) return t("err_401",{st});
    if (st === 404) return t("err_404");
    if (st === 429) return t("err_429");
    return t("err_provider",{st}) + (e.message || "");
  }
  switch(code){
    case "network": return t("err_network");
    case "not_granted": case "sampling_disabled": case "capability_disabled": case "not_declared": case "capability_removed":
      return t("err_na");
    case "rate_limited": return t("err_rate");
    case "invalid_json": return t("err_json");
    case "refused": return t("err_refused");
    case "cancelled": return "";
    default: return t("err_default");
  }
}

function normalize(o, h){

function fileToJpeg(file, max=900, q=.8){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(t("img_err"))); };
    img.src = url;
  });
}
function dataUrlToBlob(d){ const [h, b] = d.split(","); const mime = (h.match(/data:(.*?);/)||[])[1] || "image/jpeg"; const bin = atob(b); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); }

    headers:{"apikey":SHARED.anonKey, "authorization":"Bearer "+SHARED.anonKey, "content-type":"image/jpeg", "x-upsert":"false"}, body: dataUrlToBlob(v.image)});
  if (!r.ok) throw new Error(t("upload_err") + (await r.text()).slice(0,120));
  return SHARED.url.replace(/\/$/,"") + "/storage/v1/object/public/drawings/" + path;
}
async function generateImage(v){
  if (!api || !api.key || api.provider !== "openai") throw {code:"no_image_api"};
  const model = api.imageModel || ($("#apiImageModel") && $("#apiImageModel").value.trim()) || "gpt-image-1";
  const body = {model, prompt: drawPrompt(v, "scene"), size:"1024x1024", n:1};
  if (model.startsWith("dall-e")) body.response_format = "b64_json";
  const r = await fetch("https://api.openai.com/v1/images/generations", {method:"POST", headers:{"content-type":"application/json","authorization":"Bearer "+api.key}, body: JSON.stringify(body)});
  if (!r.ok){ let m=""; try{ m = (await r.json()).error?.message || ""; }catch(e){} throw {code:"api_"+r.status, message:m}; }
  const j = await r.json(); const d = j.data && j.data[0] || {};
  if (d.b64_json) return "data:image/png;base64," + d.b64_json;
  if (d.url){ const blob = await (await fetch(d.url)).blob(); return await fileToJpeg(blob); }
  throw {code:"invalid_json"};
}

    try{ const d = await generateImage(v); v.image = await fileToJpeg(dataUrlToBlob(d)); save(); renderGallery(); }
    catch(err){ note.textContent = errCopy(err); b.disabled = false; }
  }}, has ? t("regen") : t("gen"));
}
function dropZone(v, note){

    const f = e.target.files[0]; if (!f) return; note.textContent = t("processing");

/* ---------- gallery: local (this browser) and shared (everyone) ---------- */
function currentList(){ return galMode === "shared" ? shared.map(fromRow) : inventions.filter(v => !v.example || v.lang === uiLang); }

function publishForm(v, host){
  const name = el("input",{placeholder:t("name_ph"), "aria-label":t("name_aria"), value: store.get("fp.authorName","") || ""});
  const place = el("input",{placeholder:t("place_ph"), "aria-label":t("place_aria"), value: store.get("fp.place","") || ""});
  const note = el("span",{class:"note"}, store.get("fp.place","") ? "" : t("detecting"));
  const form = el("form",{class:"pubform", onsubmit: async e => {
    e.preventDefault(); const b = form.querySelector("button[type=submit]"); b.disabled = true; note.textContent = t("publishing");
    try{
      store.set("fp.authorName", name.value.trim()); store.set("fp.place", place.value.trim());

function pubButton(v){

}
const trCache = store.get("fp.trCache", {});
const showOriginal = new Set();
function viewOf(v){
  const vl = v.lang || "en";
  if (vl === uiLang || showOriginal.has(v.id)) return {view:v, translated:false, has: vl !== uiLang && !!getTr(v)};
  const tr = getTr(v);
  if (!tr) return {view:v, translated:false, has:false};
  return {view:{...v, name: tr.name || v.name, pitch: tr.pitch || v.pitch, steps: (tr.steps && tr.steps.length) ? tr.steps : v.steps, question: tr.question || v.question}, translated:true, has:true};
}
function getTr(v){ return (v.tr && v.tr[uiLang]) || (trCache[v.id] && trCache[v.id][uiLang]) || null; }
async function translateInvention(v, note, btn){
  const target = uiLang === "es" ? "Spanish" : "English";
  btn.disabled = true; note.textContent = t("translating");
  try{
    const o = await askJSON(`Translate the following invention from an experiential-futures game into ${target}. Keep names short and evocative, keep the meaning and tone. Reply with only a JSON object {"name":"…","pitch":"…","steps":["…"],"question":"…"} (steps: same number of items, same order).\n\n` + JSON.stringify({name:v.name, pitch:v.pitch, steps:v.steps||[], question:v.question||""}));
    const tr = { name:String(o.name||""), pitch:String(o.pitch||""), steps: Array.isArray(o.steps) ? o.steps.map(String) : [], question:String(o.question||"") };
    if (v.shared){ trCache[v.id] = {...(trCache[v.id]||{}), [uiLang]: tr}; store.set("fp.trCache", trCache); }
    else { v.tr = {...(v.tr||{}), [uiLang]: tr}; save(); }
    showOriginal.delete(v.id); renderGallery();
  }catch(e){ note.textContent = errCopy(e) || t("tr_err"); btn.disabled = false; }
}
function invCard(v0, n, total){
  const {view:v, translated, has} = viewOf(v0);
  const steps = v.steps && v.steps.length ? v.steps : null;
  const when = v.createdAt > 10 ? new Date(v.createdAt).toLocaleDateString(uiLang === "es" ? "es" : "en", {day:"2-digit", month:"short", year:"numeric"}) : "";
  const note = el("span",{class:"note"});
  const tags = el("div",{class:"row tags"});
  if (v.shared){
    if (v.mine) tags.append(el("span",{class:"example-tag mine"},t("mine_tag")));
    tags.append(el("span",{class:"eyebrow"}, [v.author, v.place, when].filter(Boolean).join(" · ") || t("anon")));
  } else {
    tags.append(v.example ? el("span",{class:"example-tag"},t("example")) : el("span",{class:"example-tag mine"},t("yours")));
    tags.append(el("span",{class:"eyebrow"}, v.sharedId ? (t("published") + (v.place ? " · " + v.place : "")) : (when || "")));
  }
  const vl = v0.lang || "en";
  if (translated){
    tags.append(el("span",{class:"chip k"}, t("translated")), el("button",{class:"tab", onclick:()=>{ showOriginal.add(v0.id); renderGallery(); }}, t("see_original")));
  } else if (vl !== uiLang && has){
    tags.append(el("span",{class:"chip"}, t("original_in_"+vl)), el("button",{class:"tab", onclick:()=>{ showOriginal.delete(v0.id); renderGallery(); }}, t("see_translation")));
  } else if (vl !== uiLang){
    tags.append(el("span",{class:"chip"}, t("original_in_"+vl)));
    if (canAI()){ const tb = el("button",{class:"tab"}, t("translate")); tb.onclick = () => translateInvention(v0, note, tb); tags.append(tb); }
  }
  const h = v.hand || {};
  const chips = el("div",{class:"chips"}, SUITS.map(s => {
    const val = s.k === "arc" ? String(h.arc||"").replace(" · within "," · ").replace(" · dentro de "," · ") : (h[s.k] || "");
    return val ? el("span",{class:"chip"+(s.k==="terrain"?" hot":"")+(s.k==="move"?" k":""), title:t("lab_"+s.k)}, val) : null;
  }));
  const actions = el("div",{class:"row actions"},
    el("button",{class:"btn", onclick:()=>{ hand={...v.hand}; for (const s of SUITS) if (!hand[s.k]) hand[s.k] = pick(decks[s.k]); locks={object:true, terrain:true}; save(); renderHand(); vary(); document.getElementById("var-section").scrollIntoView({behavior:"smooth"}); }}, t("vary_btn")),
    ...imageControls(v0, note));
  if (v.shared){
    const id = v.id.replace(/^sh-/,""); const liked = !!likes[id];
    const lb = el("button",{class:"btn like"+(liked?" on":""), title: liked ? t("unlike") : t("like"), "aria-pressed":String(liked)}, "\u25b2 " + (v.likes||0));
    lb.onclick = () => toggleLike(v0, lb, note);
    actions.prepend(lb);
    actions.append(el("button",{class:"btn ghost", onclick:()=>{ addInvention({hand:v.hand, lang:v.lang, tr:v.tr||{}, name:v.name, pitch:v.pitch, steps:v.steps, question:v.question, visual:v.visual, blender:v.blender, rejected:v.rejected, imageUrl:v.imageUrl, fromShared:v.id}); galMode="local"; setMode(); }}, t("copy_to_mine")));
    if (v.mine){
      const del = el("button",{class:"btn ghost"}, t("del_shared"));
      del.onclick = () => {
        const yes = el("button",{class:"btn orange", onclick: async () => { yes.disabled = true; note.textContent = t("deleting"); try{ await deleteShared(v.id.replace(/^sh-/,"")); renderGallery(); }catch(err){ note.textContent = err.message || t("del_err"); confirmRow.replaceWith(del); } }}, t("del_yes"));
        const no = el("button",{class:"btn ghost", onclick:()=>confirmRow.replaceWith(del)}, t("cancel"));
        const confirmRow = el("span",{class:"row", style:"gap:4px"}, el("span",{class:"note"}, t("del_sure")), yes, no);
        del.replaceWith(confirmRow);
      };
      actions.append(del);
    }
  } else {
    if (sharedOK() && !v0.sharedId) actions.append(pubButton(v0));
    actions.append(el("button",{class:"btn ghost", onclick:()=>{ inventions = inventions.filter(x=>x.id!==v0.id); if (v.example){ removedEx.push(v.id); store.set("fp.removedEx", removedEx); } save(); renderGallery(); }}, t("remove")));
  }
  actions.append(note);
  const img = (v.image || v.imageUrl) ? el("div",{class:"pic"}, el("img",{src: v.image || v.imageUrl, alt:t("drawing_of")+v.name, loading:"lazy"})) : (v.shared ? null : dropZone(v0, note));
  const more = el("details",{class:"more"},
    el("summary",{}, t("more")),
    el("div",{class:"moreb"},
      el("p",{class:"origin-s"}, sentenceNode(h,"b")),
      v.rejected && v.rejected.length ? el("p",{class:"note"}, t("rejected"), v.rejected.join(" · ")) : null,
      steps ? el("ol",{class:"steps"}, steps.map(c => el("li",{}, c))) : null,
      v.question ? el("div",{}, el("span",{class:"eyebrow"},t("deliberate")), el("p",{class:"question"}, v.question)) : null,
      v.blender ? el("div",{}, el("span",{class:"eyebrow"},t("blender_brief")),
        el("dl",{class:"brief"}, ["scene","motion","light","sound"].flatMap(k => [el("dt",{},k), el("dd",{}, v.blender[k])]))) : null,
      promptBlock(v)));
  return el("article",{class:"inv"+(img?" has-pic":"")}, img,
    el("div",{class:"body"}, tags, el("h3",{}, v.name), el("p",{class:"pitch"}, v.pitch), chips, actions, more));
}
async function setMode(){
  document.querySelectorAll("#galMode .tab").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.mode === galMode)));
  const sn = $("#sharedNote");
  if (galMode === "shared"){
    if (!sharedOK()){ sn.hidden = false; sn.textContent = t("shared_off"); renderGallery(); return; }
    if (!sharedLoaded){ sn.hidden = false; sn.textContent = t("shared_loading"); await loadShared(); }
    sn.hidden = !sharedError; sn.textContent = sharedError;
  } else sn.hidden = true;
  renderGallery();
}
function renderGallery(){
  const q = $("#q").value.trim().toLowerCase();
  renderFilters();
  const src = currentList();
  let list = src.filter(v => (!q || invText(v).includes(q)) && (!terrainFilter || (v.hand && v.hand.terrain === terrainFilter))
    && (galMode !== "shared" || ((!placeFilter || v.place === placeFilter) && (!onlyMine || v.mine))));
  if (galMode === "shared" && sortMode === "top") list = [...list].sort((a,b) => (b.likes||0) - (a.likes||0) || (b.createdAt||0) - (a.createdAt||0));
  const sr = $("#sortRow"); sr.replaceChildren(); sr.hidden = galMode !== "shared";
  if (galMode === "shared") sr.append(...["top","new"].map(m => el("button",{class:"tab","aria-pressed":String(sortMode===m), onclick:()=>{ sortMode = m; store.set("fp.sort", m); renderGallery(); }}, m === "top" ? t("sort_top") : t("sort_new"))));
  $("#count").textContent = `· ${pad(src.length)}`;
  const g = $("#gallery"); g.replaceChildren();
  if (!list.length){
    const msg = galMode === "shared" ? (sharedError ? "" : (src.length ? t("no_match") : t("shared_empty"))) : ((q||terrainFilter) ? t("no_match") : t("local_empty"));
    if (msg) g.append(el("p",{class:"note"}, msg)); return;
  }
  list.forEach((v, n) => g.append(invCard(v, n, list.length)));
}
document.querySelectorAll("#galMode .tab").forEach(t => t.onclick = () => { galMode = t.dataset.mode; terrainFilter = ""; placeFilter = ""; setMode(); });

/* ---------- decks editor ---------- */
function renderEditor(){
  const g = $("#editgrid"); g.replaceChildren();
  SUITS.forEach((s,n) => g.append(el("label",{for:"ta-"+s.k}, pad(n+1)+" "+t("lab_"+s.k), el("textarea",{id:"ta-"+s.k}, decks[s.k].join("\n")))));

function save(){ store.set("fp.decks2",decksAll); store.set("fp.locks",locks); store.set("fp.hand",hand); store.set("fp.inventions",inventions); }

/* ---------- wiring ---------- */
$("#deal").onclick = () => { hand = deal(hand); save(); renderHand(); };
$("#vary").onclick = () => vary();
$("#inventAll").onclick = () => inventAll();

$("#q").oninput = renderGallery;
$("#copyJson").onclick = async () => {
  const txt = JSON.stringify(inventions, null, 2);

  catch(e){ const ta = el("textarea",{}, txt); document.body.append(ta); ta.select(); $("#copyJson").textContent = t("select_copy"); setTimeout(()=>ta.remove(), 8000); }

$("#copyPrompt").onclick = async () => {
  if (!batch.length) vary();

  try{ await navigator.clipboard.writeText(txt); $("#aiNote").textContent = t("prompt_copied",{n:batch.length}); }
  catch(e){ $("#importBox").value = txt; $("#import").open = true; $("#aiNote").textContent = t("prompt_copy_fail"); }

$("#apiSave").onclick = () => {
  const key = $("#apiKey").value.trim(); if (!key){ $("#apiNote").textContent = t("key_first"); return; }
  const provider = $("#apiProvider").value, model = $("#apiModel").value.trim(), remember = $("#apiRemember").checked, imageModel = $("#apiImageModel").value.trim();
  api = {provider, key, model, remember, imageModel};
  try{ if (remember){ localStorage.setItem("fp.api", JSON.stringify(api)); sessionStorage.removeItem("fp.api"); } else { sessionStorage.setItem("fp.api", JSON.stringify(api)); localStorage.removeItem("fp.api"); } }catch(e){}
  $("#inventAll").hidden = false; renderGrid(); renderGallery();

};
$("#apiClear").onclick = () => {
  api = null; try{ localStorage.removeItem("fp.api"); sessionStorage.removeItem("fp.api"); }catch(e){}

$("#importBtn").onclick = () => {
  const raw = $("#importBox").value;
  let list; try{ list = parseLoose(raw); }catch(e){ $("#importNote").textContent = t("import_bad"); return; }
  if (!Array.isArray(list)) list = [list];
  let n = 0;
  list.forEach((o, j) => {
    const i = Number.isInteger(Number(o && o.i)) ? Number(o.i) : j;

    const inv = normalize(o, h); if (inv){ addInvention(inv, false); n++; }

if (!hand){
  hand = {...(uiLang === "es" ? EXAMPLES_ES : EXAMPLES_EN)[0].hand};

}

$("#aiNote").textContent = t("connecting");

(async () => {
  try{ sample = window.claude ? await window.claude.use("sample") : null; }catch(e){ sample = null; }
  if (sample){ $("#inventAll").hidden = false; $("#aiNote").textContent = t("ai_note_sample"); }

  }

    };
  }catch(e){}
})();
